# Copied into simulation_bringup; edit here. Keys derived from bringup.yaml
# (frames, topics, PF initial pose, pose source, map path) are overridden at launch.

particle_filter:
  ros__parameters:
    # ---- topics
    scan_topic: /scan
    odom_topic: /ego_racecar/odom
    map_topic: /map
    initialpose_topic: /initialpose # NOTE: the sim bridge also listens here and teleports the
                                    #   car. Set /pf/initialpose to move only the filter (e.g. to
                                    #   test recovery: RViz pose -> car jumps, filter is "kidnapped")
    pose_topic: /pf/pose            # PoseStamped at scan rate -> evaluation
    odom_out_topic: /pf/odom        # Odometry at odom rate -> planning/control
    particles_topic: /pf/particles

    # ---- frames
    map_frame: map
    odom_frame: odom
    base_frame: ego_racecar/base_link
    publish_tf: false               # sim: bridge already publishes map->base_link. Real car: true
    publish_on_odom: true

    # ---- filter
    num_particles: 2000
    resample_threshold: 0.5         # resample when N_eff < this * N
    update_min_d: 0.02              # m moved before a sensor update is allowed
    update_min_a: 0.02              # rad turned before a sensor update is allowed
    random_seed: -1                 # >= 0 for repeatable runs

    # ---- motion model (noise std = alpha * motion; see motion_model.py)
    motion:
      alpha_trans_trans: 0.1
      alpha_trans_rot: 0.05
      alpha_lat: 0.3                # lateral noise as a fraction of longitudinal
      alpha_rot_trans: 0.1
      alpha_rot_rot: 0.1
      min_sigma_xy: 0.005
      min_sigma_theta: 0.005

    # ---- sensor model (likelihood field)
    sensor:
      z_hit: 0.9
      z_rand: 0.1
      sigma_hit: 0.1                # m
      effective_beams: 20.0         # confidence: a scan counts as this many independent beams
                                    #   higher -> sharper, lower N_eff; lower -> smoother, slower to correct
      num_beams: 60                 # accuracy/cost only (no longer changes confidence)
      max_occ_dist: 2.0             # m, distance field clip
      occupied_threshold: 65
      free_threshold: 25
      penalize_non_free: true

    laser_offset_fallback: [0.275, 0.0, 0.0]   # used only if TF base->laser is unavailable

    # ---- timing
    odom_buffer_sec: 1.0            # odom history kept to interpolate the pose at each scan stamp
    scan_wait_sec: 0.05             # a scan stamped up to this much after the newest odom waits
                                    #   for the next odom message instead of being clamped

    # ---- odometry scale calibration (each particle learns a factor k on odom translation)
    odom_scale:
      enabled: true
      init_std: 0.05                # initial spread of k (covers ~+-10% calibration error)
      walk_std_per_m: 0.002         # random walk of k per metre (follows changing grip)
      min: 0.7
      max: 1.3

    # ---- recovery (augmented MCL: inject particles when the scan fit drops below normal)
    recovery:
      enabled: true
      alpha_slow: 0.001             # long-term fit average (per update; ~100 s at 10 Hz)
      alpha_fast: 0.1               # short-term fit average (~1 s at 10 Hz)
      min_inject_ratio: 0.12        # ignore smaller drops (normal fit varies up to ~0.075 on Spielberg)
      max_inject_ratio: 0.25        # max fraction of particles replaced per update
      local_std_xy: 1.0             # m, spread of injected particles around the estimate
      local_std_theta: 0.4          # rad
      global_fraction: 0.0          # share injected uniformly over free space (global relocalisation)

    # ---- initialisation
    use_initial_pose_param: false   # true: init from initial_pose once the map arrives
    initial_pose: [0.0, 0.0, 0.0]   # x, y, yaw in map (match sx/sy/stheta in sim.yaml)
    initial_std_xy: 0.25
    initial_std_theta: 0.1

    # ---- visualisation
    publish_particles_every: 2      # scans; 0 disables
    max_viz_particles: 500