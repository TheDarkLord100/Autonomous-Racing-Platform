# Strong random noise, NO scale error: heading drift and white noise doubled vs the
# no-scale run; systematic scale errors zero. Same seed -> repeatable.
odom_noise:
  ros__parameters:
    input_topic: /ego_racecar/odom
    output_topic: /ego_racecar/odom_noisy
    odom_frame: odom
    base_frame: ego_racecar/base_link
    random_seed: 42
    trans_scale_error: 0.0
    rot_scale_error: 0.0
    yaw_drift_per_m: 0.010
    trans_noise: 0.04
    rot_noise_per_rad: 0.04
    rot_noise_per_m: 0.010
    teleport_threshold: 1.0