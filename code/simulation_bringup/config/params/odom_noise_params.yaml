# Copied into simulation_bringup; edit here. Keys derived from bringup.yaml
# (frames, topics, PF initial pose, pose source, map path) are overridden at launch.

odom_noise:
  ros__parameters:
    input_topic: /ego_racecar/odom          # sim ground truth
    output_topic: /ego_racecar/odom_noisy   # drifting "wheel odometry"
    odom_frame: odom
    base_frame: ego_racecar/base_link
    random_seed: 42             # fixed -> same noise sequence every run; -1 = different every run

    # systematic errors (dominate over a lap, like a real car)
    trans_scale_error: 0.05     # odom reports 5% more distance than travelled
    rot_scale_error: 0.05       # and 5% more rotation
    yaw_drift_per_m: 0.005      # rad of heading drift per metre driven
    # per-step white noise
    trans_noise: 0.02           # std as a fraction of the step length
    rot_noise_per_rad: 0.02     # rad std per rad turned
    rot_noise_per_m: 0.005      # rad std per metre driven

    teleport_threshold: 1.0     # m; a single step longer than this is a sim reset, not motion