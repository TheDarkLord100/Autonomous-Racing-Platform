# Simulation scenario. One file per scenario; pick it with config:=<file>.
# Quick overrides on the command line: localization:= odom_noise:= planner:= tf_source:= tag:=
# Relative paths under world/stack are relative to data_root; ~ and absolute paths work too.
# Node parameters live in config/params/; the keys the bringup derives (frames, topics,
# initial poses, odometry input, pose source) are overridden at launch so they always agree.

run:
  tag: auto                          # auto -> <scenario>_<method>[_noise]_<planner>
  log_root: ~/f1tenth_simulation_logs
  viz: rviz                          # rviz | foxglove
  tf_source: gym                     # gym: RViz shows the truth (car model = real car)
                                     # localization: RViz shows what the stack believes
  record_bag: true                   # bag_topics: [] -> default list for the localizer
  monitor: true                      # one line per lap + summary.csv
  stage_timeout: 30.0                # s; warns if a stage is still waiting after this

data_root: ~/f1tenth_sim_ws/src/Autonomous-Racing-Platform/data

world:                               # what the simulated LiDAR sees: the truth
  map: ~/f1tenth_sim_ws/f1tenth_racetracks/Spielberg/Spielberg_map

stack:                               # what the stack believes
  map: Spielberg/carto/Spielberg_map.yaml
  frame: carto_map
  tf: [0.0, 0.0, -2.879]             # pose of `frame` in the gym map frame (x, y, yaw)
  raceline: Spielberg/carto/raceline/Spielberg_carto_strong_mincurv.csv
  carto_state: ''                    # carto only: sidecar with pbstream; '' = found next to map

localization:
  method: gt                         # gt | pf | carto | scan_matching
  odom_noise: false                  # localizers only: feed them the drifting odometry

planning:
  local_planner: frenet              # passthrough | frenet | rrt

params:                              # files in config/params/ (or absolute paths)
  sim: sim.yaml
  particle_filter: pf_params.yaml
  scan_matching: scan_matching_params.yaml
  carto: carto_params.yaml
  odom_noise: odom_noise_params.yaml
  local_planner: local_planner.yaml
  pure_pursuit: pure_pursuit.yaml
