# Localization-comparison recording: gym + odom_noise + FTG, one bag to replay into
# every localizer.  ros2 launch simulation_bringup loc_record_launch.py   (Ctrl-C after lap 5)
run:
  tag: locbag_Spielberg_ftg_3mps
  log_root: ~/f1tenth_simulation_logs
  viz: rviz
  record_bag: true
  bag_topics: [/scan, /ego_racecar/odom, /ego_racecar/odom_noisy, /tf, /tf_static,
               /ego_racecar/lap_count, /ego_racecar/lap_time, /ego_racecar/collision]
  monitor: true

data_root: ~/f1tenth_sim_ws/src/Autonomous-Racing-Platform/data

world:
  map: ~/f1tenth_sim_ws/f1tenth_racetracks/Spielberg/Spielberg_map

mapping:
  map_name: Spielberg
  out_dir: Spielberg/carto_new       # unused here; the mapping resolver expects it
  odom_noise: true                   # required: the localizers replay this odometry

controller:
  type: ftg
  max_speed: 3.0

params:
  sim: sim.yaml
  carto: carto_params.yaml
  odom_noise: odom_noise_params.yaml
  gap_follow: gap_follow.yaml
  pid: pid_wall.yaml