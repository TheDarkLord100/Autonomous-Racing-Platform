# pid_wall settings for the real car (the sim values live in the pid_wall package).
# The web bridge also caps speed with its slider and clamps steering to its own limit.
pid_node:
  ros__parameters:
    wall_side: "left"
    desired_distance: 0.5           # (m) set to about half your test corridor's width
    theta_deg: 35.0
    median_spread_deg: 2.0
    lookahead_time: 0.3

    kp: 1.0                         # (rad per m) starting point for ~1 m/s
    ki: 0.0
    kd: 0.15
    integral_limit: 3.0
    gain_ref_velocity: 0.0          # speed-based gain scaling off at these low speeds
    gain_scale_min: 0.5
    gain_scale_max: 3.0

    max_steering_angle: 0.35        # (rad) same limit as teleop
    max_steering_rate: 3.0

    velocity: 1.0                   # (m/s) cruise
    min_velocity: 0.6               # (m/s) near a wall ahead
    front_cone_deg: 20.0
    slow_front_distance: 2.0
    min_front_distance: 0.8

    base_frame_id: "base_link"
