<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Car web bridge</title>
<style>
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }
  html, body { margin: 0; height: 100%; background: #111; color: #ddd;
               font: 15px/1.3 system-ui, sans-serif; overflow: hidden; }
  body { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; }
  #bar { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 8px 12px;
         background: #1b1b1b; border-bottom: 1px solid #333; }
  #bar b { color: #fff; font-variant-numeric: tabular-nums; }
  .bad { color: #f66 !important; } .ok { color: #6d6 !important; }
  #main { display: grid; grid-template-columns: 1fr minmax(0, 1.6fr) 1fr; min-height: 0; }
  .pad { position: relative; margin: 12px; border-radius: 16px; background: #1e1e1e;
         border: 2px solid #333; touch-action: none; }
  .pad.active { border-color: #4a8; }
  .pad .knob { position: absolute; width: 70px; height: 70px; border-radius: 50%;
               background: #4a8; opacity: .85; pointer-events: none;
               left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .pad .label { position: absolute; bottom: 8px; width: 100%; text-align: center;
                color: #777; pointer-events: none; }
  .pad .axis { position: absolute; background: #333; pointer-events: none; }
  #throttle .axis { left: 50%; top: 10%; bottom: 10%; width: 2px; }
  #steer .axis { top: 50%; left: 10%; right: 10%; height: 2px; }
  #scanwrap { position: relative; min-height: 0; }
  #scan { position: absolute; inset: 0; width: 100%; height: 100%; }
  #controls { display: flex; align-items: center; gap: 14px; padding: 10px 14px;
              background: #1b1b1b; border-top: 1px solid #333; }
  #controls input[type=range] { flex: 1; height: 36px; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 10px;
           padding: 14px 22px; color: #fff; touch-action: manipulation; }
  #arm { background: #2a6; } #arm.armed { background: #555; }
  #estop { background: #d22; padding: 14px 34px; font-size: 18px; }
  #claim { background: #36a; display: none; }
  #overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
             background: rgba(0,0,0,.7); font-size: 22px; color: #f66; pointer-events: none; }
</style>
</head>
<body>
<div id="bar">
  <span>Link <b id="link" class="bad">offline</b></span>
  <span>RTT <b id="rtt">–</b></span>
  <span>Role <b id="role">–</b></span>
  <span>State <b id="state">–</b></span>
  <span>Battery <b id="volt">–</b></span>
  <span>Speed <b id="speed">–</b></span>
  <span>Cmd <b id="cmd">–</b></span>
</div>

<div id="main">
  <div id="throttle" class="pad"><div class="axis"></div><div class="knob"></div>
    <div class="label">throttle</div></div>
  <div id="scanwrap"><canvas id="scan"></canvas></div>
  <div id="steer" class="pad"><div class="axis"></div><div class="knob"></div>
    <div class="label">steering</div></div>
</div>

<div id="controls">
  <button id="arm">ARM</button>
  <button id="claim">TAKE CONTROL</button>
  <span>Max <b id="capval">–</b></span>
  <input id="cap" type="range" min="0" max="1.5" step="0.05" value="0.5">
  <button id="estop">STOP</button>
</div>
<div id="overlay">Connection lost — car stopped</div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const wsUrl = (location.protocol === 'https:' ? 'wss://' : 'ws://') +
              location.host + '/ws' + location.search;   // forwards ?token=
let ws = null, role = 'viewer', armed = false;
const cmd = { throttle: 0, steer: 0 };

function send(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
}

function connect() {
  ws = new WebSocket(wsUrl);
  ws.onopen = () => { $('link').textContent = 'online'; $('link').className = 'ok';
                      $('overlay').style.display = 'none'; };
  ws.onclose = () => { $('link').textContent = 'offline'; $('link').className = 'bad';
                       $('overlay').style.display = 'flex'; armed = false;
                       setTimeout(connect, 1000); };
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === 'pong') $('rtt').textContent = Math.round(performance.now() - m.t) + ' ms';
    else if (m.type === 'telemetry') onTelemetry(m);
  };
}

const fmt = (v, d, unit) => (v === null || v === undefined) ? '–' : v.toFixed(d) + unit;

function onTelemetry(m) {
  role = m.role; armed = m.armed;
  $('role').textContent = role;
  $('claim').style.display = (role === 'viewer' && m.driver_free) ? '' : 'none';
  $('state').textContent = armed ? 'ARMED' : ('safe' + (m.reason ? ' (' + m.reason + ')' : ''));
  $('state').className = armed ? 'ok' : 'bad';
  $('arm').className = armed ? 'armed' : '';
  $('volt').textContent = fmt(m.voltage, 2, ' V');
  $('speed').textContent = fmt(m.odom_speed, 2, ' m/s');
  $('cmd').textContent = m.cmd_speed.toFixed(2) + ' m/s, ' +
                         (m.cmd_steer * 180 / Math.PI).toFixed(0) + '°';
  const cap = $('cap');
  cap.max = m.speed_limit;
  if (!capDragging) cap.value = m.speed_cap;
  $('capval').textContent = m.speed_cap.toFixed(2) + ' m/s';
  if (m.scan) drawScan(m.scan);
}

// ---- pads: each tracks one finger, springs back to 0 on release ----
function makePad(el, axis, onChange) {
  const knob = el.querySelector('.knob');
  let pid = null;
  function update(e) {
    const r = el.getBoundingClientRect();
    let v;
    if (axis === 'y') {
      v = -((e.clientY - r.top) / r.height * 2 - 1) / 0.8;   // up = forward
      v = Math.max(-1, Math.min(1, v));
      knob.style.top = (50 - v * 40) + '%'; knob.style.left = '50%';
    } else {
      v = ((e.clientX - r.left) / r.width * 2 - 1) / 0.8;
      v = Math.max(-1, Math.min(1, v));
      knob.style.left = (50 + v * 40) + '%'; knob.style.top = '50%';
    }
    onChange(Math.abs(v) < 0.05 ? 0 : v);
  }
  function reset() {
    pid = null; el.classList.remove('active');
    knob.style.left = '50%'; knob.style.top = '50%'; onChange(0);
  }
  el.addEventListener('pointerdown', (e) => {
    if (pid !== null) return;
    pid = e.pointerId; el.setPointerCapture(pid); el.classList.add('active'); update(e);
  });
  el.addEventListener('pointermove', (e) => { if (e.pointerId === pid) update(e); });
  for (const t of ['pointerup', 'pointercancel', 'lostpointercapture'])
    el.addEventListener(t, (e) => { if (e.pointerId === pid) reset(); });
}
makePad($('throttle'), 'y', (v) => { cmd.throttle = v; });
// ROS convention: positive steering angle = left, so pushing right is negative
makePad($('steer'), 'x', (v) => { cmd.steer = -v; });

// ---- buttons / slider ----
$('arm').onclick = () => send({ type: 'arm' });
$('estop').onclick = () => send({ type: 'estop' });
$('claim').onclick = () => send({ type: 'claim' });
let capDragging = false;
$('cap').addEventListener('pointerdown', () => { capDragging = true; });
$('cap').addEventListener('pointerup', () => { capDragging = false; });
$('cap').addEventListener('input', (e) => send({ type: 'speed', value: parseFloat(e.target.value) }));
document.addEventListener('visibilitychange', () => { if (document.hidden) send({ type: 'estop' }); });

// ---- loops: 20 Hz commands (also the watchdog heartbeat), 2 Hz ping ----
setInterval(() => { if (role === 'driver') send({ type: 'cmd', ...cmd }); }, 50);
setInterval(() => send({ type: 'ping', t: performance.now() }), 500);

// ---- scan view: forward is up, 1 m rings ----
const canvas = $('scan'), ctx = canvas.getContext('2d');
const VIEW_RADIUS_M = 5;
function drawScan(s) {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w * dpr || canvas.height !== h * dpr) {
    canvas.width = w * dpr; canvas.height = h * dpr;
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const cx = w / 2, cy = h / 2, k = Math.min(w, h) / 2 / VIEW_RADIUS_M;
  ctx.strokeStyle = '#2a2a2a';
  for (let r = 1; r <= VIEW_RADIUS_M; r++) {
    ctx.beginPath(); ctx.arc(cx, cy, r * k, 0, 2 * Math.PI); ctx.stroke();
  }
  ctx.fillStyle = '#4a8';                       // car footprint (~0.2 x 0.38 m)
  ctx.fillRect(cx - 0.1 * k, cy - 0.3 * k, 0.2 * k, 0.38 * k);
  ctx.fillStyle = '#f84';
  for (let i = 0; i < s.ranges.length; i++) {
    const r = s.ranges[i];
    if (!r) continue;
    const a = s.angle_min + i * s.angle_inc;
    const x = r * Math.cos(a), y = r * Math.sin(a);   // base_link: x fwd, y left
    ctx.fillRect(cx - y * k - 1.5, cy - x * k - 1.5, 3, 3);
  }
}

connect();
</script>
</body>
</html>
